<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#1d4ed8" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Enkh Baterdene — Software Developer. Resume, projects, photography, and tutorials." />
  <meta name="author" content="Enkh Baterdene" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Enkh Baterdene — Portfolio" />
  <meta property="og:description" content="Software Developer (.NET / Java). Resume, projects, photography, and tutorials." />
  <meta property="og:url" content="https://enkhe.github.io/" />
  <meta property="og:image" content="assets/img-profile/Enkh.jpg" />

  <title>Enkh Baterdene — Portfolio</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%231d4ed8'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='50%25' y='58%25' font-family='Segoe UI,Inter,sans-serif' font-size='34' font-weight='800' text-anchor='middle' fill='white'%3EE%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />

  <!-- Set theme before paint to avoid flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <!-- Decorative background -->
  <div class="bg-aurora" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>
  <div class="topbar-particles" id="topParticles" aria-hidden="true"></div>

  <div class="app">
    <!-- Header -->
    <header class="app-header glass" role="banner">
      <a class="app-header__brand" href="#/" aria-label="Enkh Baterdene — home">
        <span class="app-header__brand-mark" aria-hidden="true">E</span>
        <span class="app-header__brand-text">Enkh<span class="muted">.dev</span></span>
      </a>
      <div class="app-header__spacer"></div>
      <div class="app-header__actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle color theme" title="Toggle theme">
          <i data-lucide="sun" class="icon-sun" aria-hidden="true"></i>
          <i data-lucide="moon" class="icon-moon" aria-hidden="true"></i>
        </button>
        <button class="icon-btn app-header__menu-toggle" type="button" data-drawer-open aria-label="Open navigation menu" aria-controls="mobileDrawer" aria-expanded="false">
          <i data-lucide="menu" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- Sidebar (desktop) -->
    <aside class="app-sidebar glass" aria-label="Primary">
      <nav class="nav" data-nav-primary aria-label="Primary"></nav>
    </aside>

    <!-- Main -->
    <main class="app-main" id="main" tabindex="-1">
      <article class="page glass glass--strong" id="pageRoot" aria-live="polite" aria-busy="false"></article>
    </main>

    <!-- Footer -->
    <footer class="app-footer glass">
      <div>&copy; <span data-year>2026</span> Enkh Baterdene. All rights reserved.</div>
      <ul class="app-footer__links bare-list">
        <li><a href="https://github.com/enkhe" target="_blank" rel="noopener noreferrer">GitHub</a></li>
        <li><a href="mailto:contact.enkude@gmail.com">Email</a></li>
        <li><a href="http://enkude.com/" target="_blank" rel="noopener noreferrer">Photography</a></li>
      </ul>
    </footer>
  </div>

  <!-- Mobile drawer -->
  <div class="drawer" id="mobileDrawer" role="dialog" aria-modal="true" aria-label="Navigation" data-open="false">
    <div class="drawer__scrim" data-drawer-close></div>
    <div class="drawer__panel glass glass--strong">
      <button class="icon-btn drawer__close" type="button" data-drawer-close aria-label="Close menu">
        <i data-lucide="x" aria-hidden="true"></i>
      </button>
      <div class="app-header__brand">
        <span class="app-header__brand-mark" aria-hidden="true">E</span>
        <span class="app-header__brand-text">Enkh.dev</span>
      </div>
      <nav class="nav" data-nav-primary aria-label="Primary mobile"></nav>
    </div>
  </div>

  <!-- Vendor scripts (classic, run synchronously before module) -->
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <!-- App entry (module, deferred) -->
  <script src="assets/js/script.js" type="module"></script>
</body>
</html>
